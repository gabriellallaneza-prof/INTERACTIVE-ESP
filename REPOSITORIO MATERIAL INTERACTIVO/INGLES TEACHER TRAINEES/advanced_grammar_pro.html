            "does she realize",
            "she did realize"
          ],
          correctAnswer: "did she realize",
          explanation: "As detailed in Huddleston & Pullum's *Cambridge Grammar of the English Language* (CGEL, 2002), restrictive time adjuncts starting with 'Only when...' trigger subject-auxiliary inversion in the matrix clause. Thus, the dummy operator 'did' must precede the subject 'she', and the verb takes the bare infinitival aspect.",
          categoryHint: "Only when + adjunct clause -> auxiliary + subject + lexical verb (CGEL §11.2)"

            "Barely",
            "Scarcely"
          ],
          correctAnswer: "No sooner",
          explanation: "In accordance with Quirk et al. (1985) in *A Comprehensive Grammar of the English Language*, 'No sooner' acts as a negative correlative operator paired strictly with the comparative particle 'than' to denote near-instantaneous sequence. 'Hardly', 'scarcely', and 'barely' mandate coordination via 'when' or 'before'.",

        },

            "Which",
            "That",
            "It was"
          ],
          correctAnswer: "What",
          explanation: "This displays a pseudo-cleft (or wh-cleft) construction. The fused relative pronoun 'What' introduces the subordinate clause (acting as 'the thing that'), allowing the focused informational element (the absence of communication) to occupy the post-copular focal position.",
          categoryHint: "Wh-clefting for informational focus (Quirk §18.27)"

            "when",

            "where"
          ],
          correctAnswer: "that",
          explanation: "In a standard it-cleft focused on a prepositional adjunct of time ('in the seventeenth century'), the relative clause is introduced by the declarative subordinator 'that'. While temporal relative 'when' is frequently observed colloquially, formal academic registers require 'that' (CGEL, 2002).",

            "Were",
            "Had",
            "If"

          correctAnswer: "Should",
          explanation: "This represents subject-auxiliary inversion in an open conditional clause (First Conditional). The modal auxiliary 'should' is fronted, dropping the conditional subordinator 'if'. This structure represents a low-probability contingency, characteristic of high-register professional discourse.",
          categoryHint: "Inverted conditional operators displaying epistemic possibility"
        },
        {
          id: 'q6',

          level: 'C1',
          questionText: "Had they not undertaken a thorough risk-management audit in the third quarter, the fiscal fallout ______ devastating.",
          options: [
            "would have been",
            "had been",
            "would be",
            "will have been"
          ],
          correctAnswer: "would have been",
          explanation: "An inverted Third Conditional denoting a counterfactual past event. The conditional clause contains the past perfect ('Had they not undertaken'), which logically pairs with a past counterfactual result expressed by the perfect conditional 'would have been' (Quirk et al., 1985).",
          categoryHint: "Past counterfactual conditional inversion"
        },
        {
          id: 'q7',
          topic: 'Advanced Conditionals',
          level: 'C2',
          questionText: "Were it not for the ongoing research endowment, the laboratory ______ to scale back its experiments on quantum mechanics starting next cycle.",
          options: [
            "would be forced",
            "will have been forced",
            "were forced",
            "had been forced"
          ],
          correctAnswer: "would be forced",
          explanation: "A mixed counterfactual conditional. The protasis 'Were it not for...' indicates an inverted present counterfactual state (ongoing funding), which triggers a hypothetical ongoing or future consequence in the apodosis expressed by the present conditional 'would be forced'.",
          categoryHint: "Mixed counterfactual: present hypothesis with subsequent outcome"
        },
        {
          id: 'q8',
          topic: 'Subjunctive Mood',
          level: 'C2',

          options: [

            "investigates",
            "investigated",
            "must investigate"

          correctAnswer: "investigate",
          explanation: "Adjectives expressing deontic urgency, necessity, or importance (e.g., paramount, vital, imperative) license the mandative subjunctive in the content clause. The verb must remain in its base form 'investigate', neutral with respect to third-person singular agreement (CGEL §11.6).",

      // Safe copy function meeting restrictions
      function copyTextToClipboard(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
      }

      // Safe exponential backoff caller for direct Gemini client integration in the web browser
      async function fetchGeminiData(prompt, systemInstruction) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: {
            responseMimeType: "application/json"
          }
        };

        let delay = 1000;
        for (let i = 0; i < 5; i++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`HTTP Error: status ${response.status}`);
            }

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              // Sanitize standard code block markings if returned
              const sanitizedText = text.replace(/```json\s?|```/g, '').trim();
              return JSON.parse(sanitizedText);
            }
            throw new Error("Invalid or empty response structure from model.");
          } catch (error) {
            if (i === 4) throw error;
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
          }
        }
      }

      // --- COMPONENT: DIAGNOSTIC QUIZ ---
      function DiagnosticQuiz({ onQuizCompleted, onBackToDashboard, selectedTopicFromDashboard, showToast }) {
        const topics = [
          'Negative Inversion',
          'Cleft Sentences',
          'Advanced Conditionals',
          'Subjunctive Mood',
          'Advanced Gerunds & Infinitives',
          'Ellipsis & Substitution'
        ];

        const [activeTopic, setActiveTopic] = useState(selectedTopicFromDashboard || 'Negative Inversion');
        const [level, setLevel] = useState('C1');
        const [useAI, setUseAI] = useState(false);
        const [isGenerating, setIsGenerating] = useState(false);
        const [apiError, setApiError] = useState(null);

        const [questions, setQuestions] = useState([]);
        const [currentIdx, setCurrentIdx] = useState(-1);
        const [selectedAnswer, setSelectedAnswer] = useState(null);
        const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
        const [sessionScore, setSessionScore] = useState(0);
        const [answersSummary, setAnswersSummary] = useState([]);

        const startQuizSession = async () => {
          setIsGenerating(true);
          setApiError(null);
          setSelectedAnswer(null);
          setIsAnswerSubmitted(false);
          setSessionScore(0);
          setAnswersSummary([]);

          if (useAI) {
            try {
              const systemPrompt = "You are an elite Cambridge/Oxford caliber ESL examination designer creating advanced assessments for C1/C2 candidates. Your responses must strictly contain valid JSON arrays matching the requested structures.";
              const prompt = `Generate exactly 5 highly advanced, natural multiple-choice English grammar question items on the specific topic: "${activeTopic}".
The difficulty level must be strictly suited for CEFR ${level} advanced learners of English.
Ensure the questions represent authentic academic, literature, or high-register professional usage, focusing on subtle grammatical aspects, register, and syntactic rules.
Each question must include 4 distinct, plausible options where only 1 option is grammatically correct.
Provide a clear, detailed grammatical explanation referencing established academic grammars (like Huddleston & Pullum's CGEL, or Quirk et al. CGEL) clarifying why the correct choice stands and why the other options are sophisticated distractors with minor faults.
Also provide a categoryHint summarizing the formula or key pattern.

Return ONLY a raw JSON array matching this schema:
[
  {
    "id": "q_ai_1",
    "topic": "${activeTopic}",
    "level": "${level}",
    "questionText": "Sentence containing a blank '______' for multiple choice completion.",
    "options": ["Option A", "Option B", "Option C", "Option D"],
    "correctAnswer": "Option A",
    "explanation": "Detailed professional linguistic breakdown with academic citations...",
    "categoryHint": "Short syntax formula label"
  }
]`;

              const result = await fetchGeminiData(prompt, systemPrompt);
              if (result && Array.isArray(result) && result.length > 0) {
                setQuestions(result);
                setCurrentIdx(0);
                showToast("¡Prueba de diagnóstico generada con Gemini exitosamente!", "success");
              } else {
                throw new Error("No questions retrieved. Check model formatting.");
              }
            } catch (err) {
              console.error(err);
              setApiError("Unable to load dynamic AI questions. The app fell back to the local premium database.");
              // Local fallback matching topic
              const localSet = curatedQuestions.filter(q => q.topic === activeTopic);
              setQuestions(localSet.length > 0 ? localSet : curatedQuestions.slice(0, 5));
              setCurrentIdx(0);
            } finally {
              setIsGenerating(false);
            }
          } else {
            const localSet = curatedQuestions.filter(q => q.topic === activeTopic);
            setQuestions(localSet.length > 0 ? localSet : curatedQuestions.slice(0, 5));
            setCurrentIdx(0);
            setIsGenerating(false);
            showToast("Banco local de preguntas académicas cargado.", "info");
          }
        };

        const handleSubmitAnswer = () => {
          if (!selectedAnswer || isAnswerSubmitted) return;
          const currentQ = questions[currentIdx];
          const isCorrect = selectedAnswer === currentQ.correctAnswer;
          
          if (isCorrect) {
            setSessionScore(prev => prev + 1);
          }
          setAnswersSummary(prev => [...prev, { q: currentQ, chosen: selectedAnswer, isCorrect }]);
          setIsAnswerSubmitted(true);
        };

        const handleNext = () => {
          if (currentIdx + 1 < questions.length) {
            setCurrentIdx(currentIdx + 1);
            setSelectedAnswer(null);
            setIsAnswerSubmitted(false);
          } else {
            onQuizCompleted(activeTopic, sessionScore, questions.length);
            setCurrentIdx(-2);
          }
        };

        return (
          <div className="bg-white rounded-2xl border border-slate-100 shadow-md p-6 max-w-4xl mx-auto">
            {currentIdx === -1 && (
              <div className="space-y-6 animate-fade-in">
                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div className="flex items-center gap-2">
                    <button onClick={onBackToDashboard} className="p-1 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700 cursor-pointer">
                      <Icon name="chevronLeft" className="w-5 h-5" />
                    </button>
                    <div>
                      <h2 className="text-xl font-bold text-slate-800">Advanced Diagnostic Quizzes</h2>
                      <p className="text-xs text-slate-400 font-sans">Validate syntactic precision and structural rules</p>
                    </div>
                  </div>
                  <span className="text-xs text-slate-400 font-mono">Arena I</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 pt-2">
                  <div className="space-y-4">
                    <label className="block text-sm font-semibold text-slate-700">1. Select Advanced Domain</label>
                    <div className="grid grid-cols-1 gap-2">
                      {topics.map((t) => (
                        <button
                          key={t}
                          onClick={() => setActiveTopic(t)}
                          className={`p-3 text-left text-xs rounded-xl border text-slate-700 font-medium transition-all flex justify-between items-center cursor-pointer ${
                            activeTopic === t 
                              ? 'bg-indigo-50/70 text-indigo-700 border-indigo-200 shadow-2xs' 
                              : 'bg-white border-slate-100 hover:bg-slate-50/50'
                          }`}
                        >
                          <span>{t}</span>
                          <span className="text-[9px] uppercase font-mono px-1.5 bg-slate-50 border rounded text-slate-400">C1/C2</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-6 flex flex-col justify-between">
                    <div className="space-y-4">
                      <label className="block text-sm font-semibold text-slate-700">2. Configure Parameters</label>
                      
                      <div className="p-4 bg-slate-50/50 rounded-xl space-y-2 border border-slate-100">
                        <span className="text-xs text-slate-500 font-medium block">Target CEFR Register</span>
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => setLevel('C1')}
                            className={`flex-1 py-2 text-xs font-bold rounded-lg border cursor-pointer transition-all ${
                              level === 'C1' ? 'bg-white border-indigo-200 text-indigo-600 shadow-2xs' : 'bg-transparent border-transparent text-slate-500'
                            }`}
                          >
                            C1 (Proficiency)
                          </button>
                          <button
                            type="button"
                            onClick={() => setLevel('C2')}
                            className={`flex-1 py-2 text-xs font-bold rounded-lg border cursor-pointer transition-all ${
                              level === 'C2' ? 'bg-white border-indigo-200 text-indigo-600 shadow-2xs' : 'bg-transparent border-transparent text-slate-500'
                            }`}
                          >
                            C2 (Mastery)
                          </button>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50/50 rounded-xl space-y-3 border border-slate-100 font-sans">
                        <span className="text-xs text-slate-500 font-medium block">Engine Selector</span>
                        <div className="flex flex-col gap-2">
                          <label className={`p-3 rounded-lg border cursor-pointer transition-all flex items-start gap-3 ${!useAI ? 'bg-white border-indigo-200 shadow-2xs' : 'bg-transparent border-transparent'}`}>
                            <input type="radio" checked={!useAI} onChange={() => setUseAI(false)} className="mt-0.5" />
                            <div>
                              <span className="text-xs font-bold text-slate-700 block">Linguist Curated Standard</span>
                              <span className="text-[10px] text-slate-400 block mt-0.5">Static set of highly complex academic testing items with references.</span>
                            </div>
                          </label>

                          <label className={`p-3 rounded-lg border cursor-pointer transition-all flex items-start gap-3 ${useAI ? 'bg-white border-indigo-200 shadow-2xs' : 'bg-transparent border-transparent'}`}>
                            <input type="radio" checked={useAI} onChange={() => setUseAI(true)} className="mt-0.5" />
                            <div>
                              <span className="text-xs font-bold text-slate-700 flex items-center gap-1">
                                Generative AI (Gemini 2.5)
                                <Icon name="sparkles" className="w-3.5 h-3.5 text-indigo-500" />
                              </span>
                              <span className="text-[10px] text-slate-400 block mt-0.5">Infinite dynamic variations generated server-side.</span>
                            </div>
                          </label>
                        </div>
                      </div>
                    </div>

                    {apiError && (
                      <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700 flex items-start gap-2">
                        <Icon name="shieldAlert" className="w-4 h-4 mt-0.5 shrink-0" />
                        <p>{apiError}</p>
                      </div>
                    )}

                    <button
                      onClick={startQuizSession}
                      disabled={isGenerating}
                      className="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white font-bold rounded-xl text-sm transition-all cursor-pointer flex items-center justify-center gap-2"
                    >

            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
              <div className="flex items-center gap-2 font-sans">
                <button onClick={onBackToDashboard} className="p-1 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700 cursor-pointer">
                  <Icon name="chevronLeft" className="w-5 h-5" />
                </button>
                <div>
                  <h2 className="text-xl font-bold text-slate-800">Advanced Prose Style Analyzer</h2>
                  <p className="text-xs text-slate-400">Scan academic/business writing for idiomatic flow and clausal flaws</p>
                </div>
              </div>
              <span className="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded font-mono font-bold">Arena III</span>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 pt-2">
              <div className="lg:col-span-1 space-y-4 font-sans">
                <span className="text-xs font-semibold text-slate-500 uppercase font-mono tracking-wider block">1. Quick Load Sample Paragraphs</span>
                <div className="space-y-2">
                  {sampleParagraphs.map((samp, i) => (
                    <button
                      key={i}
                      onClick={() => { setInputText(samp.text); setReport(null); setApiError(null); }}
                      className="w-full text-left p-3 border border-slate-100 hover:border-emerald-300 rounded-lg bg-slate-50/50 hover:bg-white text-[11px] font-medium text-slate-600 leading-normal transition-all cursor-pointer block"
                    >
                      {samp.title}
                    </button>
                  ))}
                </div>

                <div className="p-4 bg-emerald-50/35 border border-emerald-100 text-slate-600 rounded-xl space-y-2 mt-4 text-xs">
                  <span className="font-bold text-emerald-800 uppercase font-mono text-[9px] tracking-wider block">Analytical Criteria Examined</span>
                  <ul className="space-y-1.5 list-disc list-inside text-slate-500 text-[11px]">
                    <li>Register Stability (CGEL, 2002)</li>
                    <li>Incorrect Perfect Aspect</li>
                    <li>Subjunctive Mood Mandates</li>
                    <li>Awkward Prepositional Adjuncts</li>
                    <li>Idiomatic Synonyms Density</li>
                  </ul>
                </div>
              </div>

              <div className="lg:col-span-2 space-y-5">
                <div className="space-y-2 font-sans">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-slate-600 uppercase font-mono tracking-wider">Paste Prose for Evaluation</label>
                    {inputText.trim() !== '' && (
                      <button onClick={() => { setInputText(''); setReport(null); setApiError(null); }} className="text-xs text-slate-400 hover:text-red-500 cursor-pointer">
                        Clear Prose
                      </button>
                    )}
                  </div>
                  <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="Paste your C1/C2 draft essay, coverage memo, research abstract, or paragraph here (minimum 20 words recommended)..."
                    disabled={isAnalyzing}
                    rows={8}
                    className="w-full p-4 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-hidden transition-all font-sans resize-y"
                  ></textarea>
                </div>

                {apiError && (
                  <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700 flex items-start gap-2">
                    <Icon name="shieldAlert" className="w-4 h-4 mt-0.5 shrink-0" />
                    <p>{apiError}</p>
                  </div>
                )}

                <div className="flex justify-end font-sans">
                  <button
                    onClick={handleAnalyze}
                    disabled={isAnalyzing || inputText.trim() === ''}
                    className="py-3 px-6 bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 text-white font-bold rounded-xl text-xs cursor-pointer flex items-center gap-2"
                  >
                    {isAnalyzing ? (
                      <>
                        <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        Synthesizing lexical profile...
                      </>
                    ) : "Deconstruct Prose Style"}
                  </button>
                </div>

                {report && (
                  <div className="border border-slate-100 bg-white shadow-xs rounded-2xl p-6 space-y-6 animate-slide-up font-sans">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-indigo-50/50">
                      <div>
                        <h3 className="font-bold text-slate-800 text-sm">Lexical Style Diagnostics</h3>
                        <p className="text-xs text-slate-400 font-sans">CEFR Register Breakdown</p>
                      </div>

                      <div className="flex flex-wrap gap-3 font-sans">
                        <div className="bg-indigo-50/70 border border-indigo-100 px-3 py-1.5 rounded-lg text-center min-w-[80px]">
                          <span className="text-[9px] text-indigo-400 uppercase font-mono tracking-wider block">Estimated CEFR</span>
                          <span className="text-lg font-bold text-indigo-700">{report.cefrLevelEstimated}</span>
                        </div>

                        <div className="bg-emerald-50 border border-emerald-100 px-3 py-1.5 rounded-lg text-center min-w-[80px]">
                          <span className="text-[9px] text-emerald-500 uppercase font-mono tracking-wider block">Deficiencies</span>
                          <span className="text-lg font-bold text-emerald-700">{report.errorsDetected?.length || 0}</span>
                        </div>
                      </div>
                    </div>

                    <div className="flex border-b border-slate-100 font-sans">
                      <button
                        onClick={() => setActiveTabCompare('errors')}
                        className={`py-2 px-4 text-xs font-bold border-b-2 cursor-pointer ${
                          activeTabCompare === 'errors' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400'
                        }`}
                      >
                        Diagnostic Journal ({report.errorsDetected?.length || 0})
                      </button>
                      <button
                        onClick={() => setActiveTabCompare('rewrite')}
                        className={`py-2 px-4 text-xs font-bold border-b-2 cursor-pointer ${
                          activeTabCompare === 'rewrite' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400'
                        }`}
                      >
                        Polished Native Alternative
                      </button>
                    </div>

                    <div className="p-4 bg-slate-50/60 rounded-xl border border-slate-100 space-y-2">
                      <div className="flex items-center gap-1.5 text-xs font-bold text-indigo-800 uppercase font-mono tracking-wider">
                        <Icon name="bookOpen" className="w-4 h-4 text-indigo-600" />
                        <span>General Syntactic Evaluation Summary</span>
                      </div>
                      <p className="text-xs text-slate-600 leading-relaxed">{report.overallFeedback}</p>
                    </div>

                    {activeTabCompare === 'errors' ? (
                      <div className="space-y-4">
                        {report.errorsDetected?.length === 0 ? (
                          <div className="text-center p-8 border border-dashed border-slate-200 rounded-xl text-xs text-slate-400">
                            🎉 Flawless prose profile! No grammatical slips or non-idiomatic registers detected.
                          </div>
                        ) : (
                          <div className="space-y-3">
                            {report.errorsDetected.map((err, i) => (
                              <div key={i} className="p-4 bg-white rounded-xl border border-slate-100 shadow-2xs hover:shadow-xs space-y-2 text-xs">
                                <div className="flex items-start justify-between flex-wrap gap-2">
                                  <span className={`px-2 py-0.5 rounded-full font-mono font-bold text-[9px] uppercase border ${
                                    err.severity === 'major' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-amber-50 text-amber-600 border-amber-100'
                                  }`}>
                                    {err.severity}
                                  </span>
                                  <span className="bg-slate-100 border text-slate-500 rounded px-1.5 py-0.5 text-[10px] font-mono">
                                    Topic: {err.category}
                                  </span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                  <div className="p-2.5 bg-red-50/20 rounded border border-red-100/50">
                                    <span className="text-[10px] uppercase font-mono text-slate-400 font-bold block mb-0.5">Original Segment</span>
                                    <span className="font-semibold text-red-800 line-through">"{err.original}"</span>
                                  </div>

                                  <div className="p-2.5 bg-emerald-50/20 rounded border border-emerald-100/50">
                                    <span className="text-[10px] uppercase font-mono text-slate-400 font-bold block mb-0.5">Linguistic Correction</span>
                                    <span className="font-bold text-emerald-800">"{err.correction}"</span>
                                  </div>
                                </div>

                                <p className="text-slate-500 leading-relaxed mt-2">
                                  <strong className="text-slate-700 font-semibold font-mono text-[9px] uppercase block mb-0.5">Grammar Justification:</strong>
                                  {err.explanation}
                                </p>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div className="p-4 border border-slate-200 rounded-xl bg-slate-50/50 space-y-2">
                            <span className="text-[10px] font-mono font-bold uppercase tracking-wider text-slate-400 block border-b pb-1.5">Submitted Draft Copy</span>
                            <blockquote className="text-xs text-slate-500 leading-relaxed italic whitespace-pre-wrap">"{report.originalText}"</blockquote>
                          </div>

                          <div className="p-4 border border-emerald-100 rounded-xl bg-emerald-50/15 space-y-2">
                            <span className="text-[10px] font-mono font-bold uppercase tracking-wider text-emerald-600 block border-b pb-1.5 flex items-center justify-between">
                              <span>Synthesized Masterpiece</span>
                              <span className="bg-emerald-50 px-1 py-0.5 rounded text-[9px] border border-emerald-200 text-emerald-700 uppercase">Expert</span>
                            </span>
                            <blockquote className="text-xs text-slate-700 leading-relaxed font-medium whitespace-pre-wrap">{report.suggestedSophisticatedVersion}</blockquote>
                          </div>
                        </div>

                        <div className="bg-amber-50/50 border border-amber-100 p-4 rounded-xl text-xs text-amber-900/90 leading-relaxed mt-4">
                          <span className="font-bold uppercase font-mono text-[9px] tracking-wider text-amber-800 block mb-1">Pedagogical Review Tip</span>
                          Compare the lexical density and structural balance. Tense consistency, negative inversion clauses, and precise prepositional patterns distinguish native-level writing.
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // --- COMPONENT: APP ---
      function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [selectedTopicFromDashboard, setSelectedTopicFromDashboard] = useState(null);

        // Toast notifications state
        const [toast, setToast] = useState(null);
        const [isModalOpen, setIsModalOpen] = useState(false);

        // Core stats state
        const [stats, setStats] = useState({
          quizzesCompleted: 0,
          scoreTotal: 0,
          questionsAnswered: 0,
          correctAnswers: 0,
        });

        // Topic mastery state
        const [mastery, setMastery] = useState({
          'Negative Inversion': 0,
          'Cleft Sentences': 0,
          'Advanced Conditionals': 0,
          'Subjunctive Mood': 0,
          'Advanced Gerunds & Infinitives': 0,
          'Ellipsis & Substitution': 0,
        });

        const [history, setHistory] = useState([]);

        // Load initial state from storage
        useEffect(() => {
          try {
            const savedStats = localStorage.getItem('tester_stats_v1');
            const savedMastery = localStorage.getItem('tester_mastery_v1');
            const savedHistory = localStorage.getItem('tester_history_v1');

            if (savedStats) setStats(JSON.parse(savedStats));
            if (savedMastery) setMastery(JSON.parse(savedMastery));
            if (savedHistory) setHistory(JSON.parse(savedHistory));
          } catch (e) {
            console.error('Failed to load localStorage data:', e);
          }
        }, []);

        const showToast = (message, type = "info") => {
          setToast({ message, type });
        };

        const handleQuizCompleted = (topic, correctCount, totalQuestions) => {
          const accuracy = Math.round((correctCount / totalQuestions) * 100);

          const updatedStats = {
            quizzesCompleted: stats.quizzesCompleted + 1,
            scoreTotal: stats.scoreTotal + accuracy,
            questionsAnswered: stats.questionsAnswered + totalQuestions,
            correctAnswers: stats.correctAnswers + correctCount,
          };
          setStats(updatedStats);
          localStorage.setItem('tester_stats_v1', JSON.stringify(updatedStats));

          const oldScore = mastery[topic] || 0;
          const updatedMastery = {
            ...mastery,
            [topic]: oldScore === 0 ? accuracy : Math.round((oldScore + accuracy) / 2)
          };
          setMastery(updatedMastery);
          localStorage.setItem('tester_mastery_v1', JSON.stringify(updatedMastery));

          const dateStr = new Date().toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const newHistoryItem = {
            date: dateStr,
            type: 'Quiz',
            topicOrFocus: topic,
            score: `${correctCount}/${totalQuestions}`,
            status: accuracy >= 80 ? 'excellent' : accuracy >= 60 ? 'passed' : 'review'
          };

          const updatedHistory = [newHistoryItem, ...history];
          setHistory(updatedHistory);
          localStorage.setItem('tester_history_v1', JSON.stringify(updatedHistory));

          showToast(`¡Sesión de evaluación completada con ${accuracy}% de precisión!`, "success");
        };

        const handleActivityLog = (focusArea, scoreString, passed) => {
          const dateStr = new Date().toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const isAnalyzer = focusArea === 'Prose Analysis';

          const newHistoryItem = {
            date: dateStr,
            type: isAnalyzer ? 'Prose Analyzer' : 'Transformer',
            topicOrFocus: focusArea,
            score: scoreString,
            status: passed ? 'excellent' : 'review'
          };

          const updatedHistory = [newHistoryItem, ...history];
          setHistory(updatedHistory);
          localStorage.setItem('tester_history_v1', JSON.stringify(updatedHistory));

          if (!isAnalyzer) {
            const scoreNum = parseInt(scoreString.split('/')[0]);
            const updatedStats = {
              ...stats,
              questionsAnswered: stats.questionsAnswered + 1,
              correctAnswers: stats.correctAnswers + (scoreNum >= 75 ? 1 : 0),
            };
            setStats(updatedStats);
            localStorage.setItem('tester_stats_v1', JSON.stringify(updatedStats));
          }
        };

        const executeStatsClear = () => {
          const emptyStats = {
            quizzesCompleted: 0,
            scoreTotal: 0,
            questionsAnswered: 0,
            correctAnswers: 0,
          };
          const emptyMastery = {
            'Negative Inversion': 0,
            'Cleft Sentences': 0,
            'Advanced Conditionals': 0,
            'Subjunctive Mood': 0,
            'Advanced Gerunds & Infinitives': 0,
            'Ellipsis & Substitution': 0,
          };

          setStats(emptyStats);
          setMastery(emptyMastery);
          setHistory([]);

          localStorage.removeItem('tester_stats_v1');
          localStorage.removeItem('tester_mastery_v1');
          localStorage.removeItem('tester_history_v1');

          setIsModalOpen(false);
          showToast("Las estadísticas y el progreso han sido completamente reiniciados.", "info");
        };

        const handleSelectTopicQuiz = (topic) => {
          setSelectedTopicFromDashboard(topic);
          setActiveTab('quiz');
        };

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col justify-between antialiased">
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
            
            <ConfirmationModal 
              isOpen={isModalOpen}
              title="¿Reiniciar todas las estadísticas?"
              message="Esta acción borrará permanentemente todo tu historial de diagnósticos, puntuaciones, logs de actividad y niveles estimados de CEFR. No se puede deshacer."
              onConfirm={executeStatsClear}
              onCancel={() => setIsModalOpen(false)}
            />

            {/* Header */}
            <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-2xs">
              <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div 
                  onClick={() => { setActiveTab('dashboard'); setSelectedTopicFromDashboard(null); }}
                  className="flex items-center gap-2.5 cursor-pointer select-none group"
                >
                  <div className="p-2 bg-slate-900 text-white rounded-lg group-hover:scale-105 transition-transform">
                    <Icon name="brain" className="w-5 h-5 text-indigo-400" />
                  </div>
                  <div>
                    <span className="font-extrabold text-slate-900 tracking-tight text-sm md:text-base font-sans block leading-none">
                      Grammar Tester
                    </span>
                    <span className="text-[10px] text-indigo-500 font-mono uppercase tracking-wider block mt-1">C1/C2 advanced level</span>
                  </div>
                </div>

                <nav className="flex items-center gap-1.5 md:gap-3 font-sans">
                  <button
                    onClick={() => { setActiveTab('dashboard'); setSelectedTopicFromDashboard(null); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer ${
                      activeTab === 'dashboard' ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100/60'
                    }`}
                  >
                    Dashboard
                  </button>
                  <button
                    onClick={() => setActiveTab('quiz')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer ${
                      activeTab === 'quiz' ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100/60'
                    }`}
                  >
                    Quizzes
                  </button>
                  <button
                    onClick={() => setActiveTab('transformer')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer ${
                      activeTab === 'transformer' ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100/60'
                    }`}
                  >
                    Transformer
                  </button>
                  <button
                    onClick={() => setActiveTab('prose')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer ${
                      activeTab === 'prose' ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100/60'
                    }`}
                  >
                    Prose Analyzer
                  </button>
                </nav>
              </div>
            </header>

            {/* Main */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
              {activeTab === 'dashboard' && (
                <Dashboard
                  stats={stats}
                  mastery={mastery}
                  history={history}
                  onSelectTab={setActiveTab}
                  onClearStats={() => setIsModalOpen(true)}
                  onSelectTopicQuiz={handleSelectTopicQuiz}
                  showToast={showToast}
                />
              )}

              {activeTab === 'quiz' && (
                <DiagnosticQuiz
                  onQuizCompleted={handleQuizCompleted}
                  onBackToDashboard={() => setActiveTab('dashboard')}
                  selectedTopicFromDashboard={selectedTopicFromDashboard}
                  showToast={showToast}
                />
              )}

              {activeTab === 'transformer' && (
                <SentenceTransformer
                  onActivityLog={handleActivityLog}
                  onBackToDashboard={() => setActiveTab('dashboard')}
                  showToast={showToast}
                />
              )}

              {activeTab === 'prose' && (
                <ProseAnalyzer
                  onActivityLog={handleActivityLog}
                  onBackToDashboard={() => setActiveTab('dashboard')}
                  showToast={showToast}
                />
              )}
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-100 py-6 text-xs text-slate-400">
              <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <p className="font-sans">
                  &copy; {new Date().getFullYear()} C1/C2 Advanced English Grammar Diagnostic Suite.
                </p>
                <div className="flex gap-4 font-mono text-[10px] tracking-tight">
                  <span>Level: C1/C2 (Proficient User)</span>
                  <span>Refinement Engine: Gemini-2.5-flash-preview</span>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      // Root initialization
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
